<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}E-Care{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="admin-shell">
        <aside class="admin-sidebar">
            <div class="admin-logo">E-Care</div>
            <div class="admin-nav-section">메뉴</div>
            <a class="admin-nav-item {% if active_nav == 'dashboard' %}active{% endif %}" href="{{ url_for('main.dashboard') }}">📊 Dashboard</a>
            <a class="admin-nav-item {% if active_nav == 'inquiries' %}active{% endif %}" href="{{ url_for('main.inquiries_view') }}">📨 문의 목록</a>
            <a class="admin-nav-item {% if active_nav == 'employees' %}active{% endif %}" href="{{ url_for('main.employees') }}">👤 직원 데이터</a>
            <a class="admin-nav-item {% if active_nav == 'ghd_rules' %}active{% endif %}" href="{{ url_for('main.ghd_rules') }}">📋 가상 GHD 판단 기준</a>
            <a class="admin-nav-item {% if active_nav == 'home' %}active{% endif %}" href="{{ url_for('main.index') }}">🏠 홈</a>
        </aside>

        <div class="admin-main">
            <header class="admin-topbar">
                <div class="admin-topbar-title">{% block topbar_title %}E-Care{% endblock %}</div>
                <div class="admin-topbar-right">
                    {% if current_user %}<span class="admin-user-badge">{{ current_user }}</span>{% endif %}
                    <a class="admin-logout" href="{{ url_for('main.logout_view') }}">로그아웃</a>
                </div>
            </header>

            <div class="admin-content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
