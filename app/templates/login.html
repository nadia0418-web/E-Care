<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 로그인 - E-Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo">E-Care</div>
            <p class="login-sub">GHD 관리자 로그인</p>
            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}
            <form method="post">
                <input type="hidden" name="next" value="{{ next_url }}">
                <label class="login-label">아이디</label>
                <input type="text" name="username" class="text-input" autofocus autocomplete="username">
                <label class="login-label">비밀번호</label>
                <input type="password" name="password" class="text-input" autocomplete="current-password">
                <button type="submit" class="login-btn">로그인</button>
            </form>
        </div>
    </div>
</body>
</html>
